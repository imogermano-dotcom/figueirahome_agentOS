name: Uptime figueirahome.pt

on:
  # `schedule` desligado 22/09: um monitor de 5/5 min que na prática corria
  # de 4 em 4h (>98% dos gatilhos perdidos, medido 15-22/09) não detecta nada
  # — substituído pelo Cron Manager no Fly (`crons/`, schedule "site-uptime",
  # `*/5 * * * *` a sério). `workflow_dispatch` fica para correr à mão.
  workflow_dispatch: {}

jobs:
  uptime:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar figueirahome.pt
        run: |
          curl -sf -X POST "https://figueirahome-agentos.fly.dev/api/site/uptime-check" \
            -H "X-Automacao-Secret: ${{ secrets.AUTOMACAO_SECRET }}" \
            -w "\ntempo total: %{time_total}s\n" \
            --max-time 30
