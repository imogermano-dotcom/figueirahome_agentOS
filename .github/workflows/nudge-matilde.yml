name: Nudge Matilde (janela de 24h)

on:
  # `schedule` desligado 22/09: o GitHub atrasava isto 4-5h todos os dias
  # mesmo desviado do minuto 0 (medido 15-22/09, `gh run list`) — substituído
  # pelo Cron Manager no Fly (`crons/`, schedule "nudge-matilde", `12 * * * *`
  # certo, sem fila global). `workflow_dispatch` fica para correr à mão.
  workflow_dispatch: {}

jobs:
  nudge:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar nudges pendentes
        run: |
          curl -sf -X POST "https://figueirahome-agentos.fly.dev/api/matilde/nudge" \
            -H "X-Automacao-Secret: ${{ secrets.AUTOMACAO_SECRET }}" \
            -w "\ntempo total: %{time_total}s\n" \
            --max-time 120
